<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAEUS & CO. | Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@200;300;400;500&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="product-page">
    <main class="admin-shell" id="adminApp">
        <div class="admin-header">
            <span class="service-kicker">阿斯特拉乌斯行动</span>
            <h1 class="detail-title">运营管理</h1>
            <p class="cart-note">请输入 Vercel 环境变量中的私有管理员令牌。请勿公开分享此页面。</p>
        </div>

        <div class="admin-controls">
            <input id="adminToken" class="tracking-input" type="password" placeholder="ADMIN_API_TOKEN">
            <button id="checkConfigButton" class="tracking-submit" type="button">检查配置</button>
            <button id="loadOrdersButton" class="tracking-submit" type="button">加载订单</button>
            <button id="loadInquiriesButton" class="tracking-submit" type="button">加载询盘</button>
            <button id="exportInquiriesButton" class="tracking-submit" type="button">导出询盘 CSV</button>
        </div>

        <section id="adminConfig" class="admin-config">
            <p class="admin-empty">上线真实收款前，请先检查配置。</p>
        </section>

        <section id="adminOrders" class="admin-orders">
            <p class="admin-empty">输入管理员令牌后可加载订单。</p>
        </section>

        <section id="adminInquiries" class="admin-orders">
            <p class="admin-empty">点击“加载询盘”查看官网表单提交。</p>
        </section>
    </main>

    <script src="script.js?v=20260710-inquiry-actions"></script>
</body>
</html>
